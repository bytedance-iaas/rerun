# The web viewer's nginx site — a TEMPLATE. render-nginx-conf.sh fills it in at container start
# (entrypoint.sh, MODE=web) and writes /run/nginx-site.conf, which the image's
# /etc/nginx/conf.d/default.conf includes. Placeholders:
#
#   @BASE_PATH@         the URL base path the whole site lives under (env BASE_PATH): empty = the
#                       origin root (local runs, docker compose), or a path such as `/rerun`
#                       when the deployment shares its gateway domain with other services — the
#                       gateway then needs a single route for it (`/rerun` Prefix -> this nginx,
#                       no rewrite). No trailing slash.
#   @CATALOG_UPSTREAM@  host of the catalog server (env CATALOG_UPSTREAM): 127.0.0.1 in k8s,
#                       where the catalog shares the pod; the `server` service under compose.
#                       Resolved once at startup — which is why it is rendered per environment
#                       instead of written here: nginx refuses to START on a name that does not
#                       resolve, and the two environments resolve different names.
#
# Everything between `# BEGIN base-path-only` and `# END base-path-only` is dropped when the base
# path is empty: those locations exist only for a sub-path mount and would collide with the root
# layout's own.
#
# The viewer asks for every one of its own endpoints relative to the page it was loaded from
# (`config.json`, `api/…`, `downloads/sdk/`, …), so the locations below are the full surface.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Send redirects as a bare path (`Location: /rerun/`), not `http://<host>:80/rerun/`: TLS ends
    # at the gateway, so an absolute redirect built from what nginx sees would drop the browser
    # onto plain http (and an internal port).
    absolute_redirect off;

    # Optional Basic auth, rendered by entrypoint.sh at startup: with a `web_htpasswd`
    # secret the file enables auth for the whole server (viewer, config.json,
    # rrd-cache, downloads); without one it is empty and everything stays open (local dev).
    # The catalog's endpoints below opt out, see there.
    include /run/nginx-auth.conf;

    # Unauthenticated health endpoint for load balancers and k8s probes — with auth
    # enabled, a probe hitting an authenticated path would get 401 and never go ready.
    # Always at the root: the pod's probes reach nginx directly, not through the gateway.
    location = /healthz {
        auth_basic off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # BEGIN base-path-only
    # The same check under the base path, for a gateway health check that can only see the
    # deployment's own route.
    location = @BASE_PATH@/healthz {
        auth_basic off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # The bare base path is the directory, query string kept (`/rerun?url=…` -> `/rerun/?url=…`):
    # the page's relative URLs (re_viewer.js, config.json, api/…) resolve against its directory,
    # so the viewer must never run at `/rerun` itself.
    location = @BASE_PATH@ {
        return 301 @BASE_PATH@/$is_args$args;
    }

    # Nothing of this site lives outside the base path. The gateway never routes such paths
    # here; a port-forward to the root is sent to the viewer.
    location = / {
        return 302 @BASE_PATH@/;
    }
    location / {
        return 404;
    }
    # END base-path-only

    # The wasm bundle is large — compress on the wire.
    gzip on;
    gzip_types application/wasm application/javascript text/css application/json;
    # Prefer the .gz files precompressed at image build time (Dockerfile): zero
    # per-request CPU, and compression survives even if a fronting gateway meddles
    # with on-the-fly negotiation. Falls back to the plain file / gzip-on-the-fly.
    gzip_static on;

    # Server-side default TOS credentials, rendered by entrypoint.sh at startup.
    # Lives outside the html dir so a read-only dev mount of the html dir still works.
    location = @BASE_PATH@/config.json {
        alias /run/config.json;
        add_header Cache-Control "no-store";
    }

    # Download area, built together with this image so everything here always matches
    # the running services: sdk/ = the Python SDK wheels (Linux + macOS). The viewer
    # ships inside the wheel — `pip install` it and run `rerun`, no separate download.
    # autoindex lets users browse for the exact wheel filename for their platform.
    #   pip install https://<用户名>:<密码>@<域名>@BASE_PATH@/downloads/sdk/<wheel 文件名>
    # Inherits the server-wide Basic auth — none of this is public code.
    location @BASE_PATH@/downloads/ {
        alias /usr/share/nginx/downloads/;
        autoindex on;
        add_header Cache-Control "no-cache";
    }

    # The catalog server's plain-HTTP endpoints, under this site's own path — so one gateway
    # route covers the whole deployment:
    #   api/       the viewer's same-origin calls: ensure-cors, ensure-manifest, the HF cache proxy
    #   catalog/   presign / sources, for training-side tooling
    #   version    the catalog's build info, its unauthenticated liveness check
    # The base path is stripped on the way (`@BASE_PATH@/api/x` -> `/api/x`, query untouched).
    #
    # No Basic auth on these three — the same exposure as when the gateway routed them to the
    # catalog directly: catalog/ checks the caller's own bearer token (an `Authorization: Basic`
    # header would take its place), api/ is tokenless by design (see the catalog's routes in
    # re_server's entrypoint.rs), and the viewer's fetches there carry no browser credentials.
    location @BASE_PATH@/api/ {
        auth_basic off;
        proxy_pass http://@CATALOG_UPSTREAM@:51234/api/;
        proxy_http_version 1.1;
        # Data proxying (episode-sized ranges) can be slow on a bad day.
        proxy_read_timeout 300s;
        # Stream proxied data (HF cache objects can be large) instead of spooling it to disk.
        proxy_buffering off;
    }

    location @BASE_PATH@/catalog/ {
        auth_basic off;
        proxy_pass http://@CATALOG_UPSTREAM@:51234/catalog/;
        proxy_http_version 1.1;
    }

    location = @BASE_PATH@/version {
        auth_basic off;
        proxy_pass http://@CATALOG_UPSTREAM@:51234/version;
        proxy_http_version 1.1;
    }

    # Phase 2: the browser PUTs converted .rrd files here for future reuse,
    # and GETs them back on later visits. Backed by the rrd-cache volume.
    location @BASE_PATH@/rrd-cache/ {
        alias /rrd-cache/;
        dav_methods PUT;
        create_full_put_path on;
        client_max_body_size 0;
        autoindex on;
    }

    # The viewer itself (and the user guide under docs/). `alias`, not `root`: the files sit at
    # the top of the html dir whatever the base path.
    location @BASE_PATH@/ {
        alias /usr/share/nginx/html/;
        # $uri.html: the login pop-ups are requested without extension (signed-in, signed-out).
        try_files $uri $uri.html $uri/ =404;
        # The viewer files keep the same names across image updates, so browsers must
        # revalidate on every use (unchanged files still load instantly via 304) —
        # otherwise a cached old wasm keeps running after a deployment.
        add_header Cache-Control "no-cache";
    }
}
