# Dataverse: the always-on cloud deployment. One chart, two components — ReRun (the web viewer and
# the catalog server, one pod with two containers) and the curation console — plus the APIG
# gateway and the path-routed Ingresses in front of both.
#
# Nothing here is tuned for one cluster: no image, no gateway and no credentials are baked in.
# A real install supplies four things — the two image references, the two Secret names, and how to
# get a gateway (adopt one with apig.existingId, or provision one with apig.create=true).
# Everything else has a default that works.
#
# ⚠️ Keep credentials out of this file. Create the Secrets with kubectl and reference them by name
#    (secrets.existingSecret), and put the rest of your deployment's
#    values in a separate, gitignored file installed with `-f values-prod.yaml`. Helm stores values
#    verbatim in the release history, where anyone who can run `helm get values` can read them.

# Object names come from the RELEASE name — call the release `dataverse` and everything matches the
# names used throughout the deployment guide. The ReRun workload is the one exception: its
# StatefulSet, pod (rerun-cloud-0), Services and PVC (server-data-rerun-cloud-0) are always named
# `rerun-cloud`, because that component keeps its own identity inside the bundle.

# The images, as full references including the tag (e.g. <registry>/rerun:<tag>).
# REQUIRED, and deliberately empty: the chart does not track the images. Builds are tagged per
# commit and there is no `latest`, so hardcoding a reference here would mean republishing the
# chart for every build — the chart version and the image versions are not the same thing.
# ⚠️ Verify a tag exists before deploying: a tag that was never built gives ImagePullBackOff.
image:
  # The ReRun image. One image serves both containers — MODE=web is the nginx + wasm viewer,
  # MODE=server is the catalog server — so there is a single reference for both.
  rerun: ""
  # The robot_curator image, required when curator.enabled=true. A separate project from ReRun,
  # on its own release cadence, so its tag never follows the rerun one.
  curator: ""
  pullPolicy: IfNotPresent

# Where the data lives. Everything the viewer, the catalog and the console read or write is a
# `tos://` URL, and the bucket is named by the user at runtime — never configured here.
tos:
  # The ONLY field that has to be right. The two endpoints below and the presign endpoint are
  # derived from it, following Volcengine's own naming:
  #   public     https://tos-s3-<region>.volces.com    (browsers, and clients outside the cloud)
  #   internal   https://tos-s3-<region>.ivolces.com   (in-cloud components: faster, no public
  #                                                     traffic billed)
  region: cn-beijing

  # Both empty on purpose — leave them that way unless the derived address is wrong for your
  # deployment. The one case that needs an override is a cluster with no internal route to TOS:
  # set endpointInternal to the public address so in-cluster components stop trying the ivolces
  # one. A custom or S3-compatible endpoint goes here too.
  endpointPublic: ""
  endpointInternal: ""

  # Cache bucket for converted rrd artifacts, as a `tos://bucket/prefix/` URL.
  # "off" disables the cache: everything still works, datasets just get converted on every open.
  rrdArtifactsUrl: "off"

# All credentials come from ONE Secret you create yourself. The chart never renders it: Helm
# stores values verbatim in the release history, so a credential passed through values stays
# readable to anyone who can run `helm get values`. The name below is REQUIRED — rendering fails
# with instructions rather than deploying something that cannot start.
#
# ⚠️ The Secret must live in the release's namespace. Kubernetes does not let a pod reference a
#    Secret from another one, so sharing credentials across namespaces means creating the same
#    Secret name in each — the name is what is common, not the object.
secrets:
  # Every credential of the deployment, in one Secret. `rerun server generate-secret` prints the
  # token signing key as plain text — store it like any other credential (paste into a console
  # form, or an env var for the CLI flow):
  #
  #   kubectl -n <namespace> create secret generic dataverse-secrets \
  #       --from-literal=tos_access_key=<ak> \
  #       --from-literal=tos_secret_key=<sk> \
  #       --from-literal=server_token_secret="$(rerun server generate-secret)" \
  #       --from-literal=web_htpasswd="<user>:$(openssl passwd -apr1)"
  #
  # Keys, and what reads them:
  #   tos_access_key / tos_secret_key   REQUIRED — the viewer, the catalog and the console
  #   server_token_secret               REQUIRED when catalog.tokenAuth.enabled — the catalog's
  #                                     token signing key (`rerun server generate-secret`).
  #                                     Whoever holds it can sign a token with any permission
  #   web_htpasswd                      REQUIRED when web.basicAuth.enabled — one
  #                                     `username:password-hash` per line, in Apache htpasswd
  #                                     format (`openssl passwd -apr1` or `htpasswd -B`). The
  #                                     viewer and the console share this one table: same domain,
  #                                     so one login opens both
  #   hf_token                          optional — only for private HuggingFace datasets
  #   ark_api_key                       optional — the console's Volcengine Ark VLM backend. The
  #                                     matching base url is not a secret, see curator.arkBaseUrl
  #
  # The optional keys are read with `optional: true`, so leaving them out of the Secret simply
  # leaves the matching feature off.
  # ⚠️ The chart cannot see this Secret's contents, so editing it does NOT roll the pods. Run
  #    `kubectl rollout restart` afterwards, or the old values stay live.
  # ⚠️ To update single keys later, `kubectl patch secret … -p '{"stringData":{…}}'` — a
  #    re-created Secret drops every key the create command does not list.
  existingSecret: ""

# The web viewer container: nginx serving the wasm viewer plus the browser's /config.json.
web:
  # HTTP Basic auth, from the web_htpasswd account table in the Secret above. Off means the pages
  # are unauthenticated — private-network or local debugging only, and the chart refuses to render
  # that combination together with a public APIG entry point.
  basicAuth:
    enabled: true

  # How many ready-made rrd artifacts the browser downloads in parallel when opening a dataset.
  # 0 = automatic (3 in the browser).
  rrdArtifactsPrefetch: "0"

  # Serving static assets, so it stays small. The heavy lifting happens in the browser.
  resources:
    requests: { cpu: 500m, memory: 512Mi }
    limits:   { cpu: "2",  memory: 2Gi }

# The catalog server container: dataset registration, presigned reads, and the gRPC API.
catalog:
  # Signed tokens, verified against the secret above. Off means the catalog is wide open to anyone
  # who can reach it — private-network debugging only, and refused together with a public entry
  # point.
  tokenAuth:
    enabled: true

  # Self-service bucket CORS. A browser cannot read a TOS bucket that does not name the viewer's
  # origin in its CORS rules, so when the viewer opens a bucket it asks the server, through the
  # same-origin /api/ensure-cors, to check that bucket and fill in the missing rules — appending
  # ours, never touching anyone else's.
  # Needs an AK/SK with bucket administration rights; turning it off means doing it by hand for
  # every bucket (the procedure is in the deployment guide).
  autoCors:
    enabled: true
    # Browser origins to allow. Empty = automatic: the region's gateway wildcard domain plus the
    # local debugging origin, which covers this chart's topology.
    origins: []

  # Which network the presigned URLs are signed for. These URLs are handed to clients that read
  # dataset files directly, so this is about where those clients sit — not about the server:
  #   public     training clients outside the cloud (the default, and the safe one)
  #   internal   every client runs inside this VPC; faster, and no public traffic billed
  # ⚠️ A URL signed for one network does not work on the other: the signature covers the host.
  presignNetwork: public

  # Mirror for HuggingFace operations. Empty = go straight to the official site, which is the right
  # setting for clusters outside China. Reaches the in-cloud components as the HF_ENDPOINT env var
  # AND the user's browser via the web viewer's /config.json (hf_endpoint key).
  hfEndpoint: https://hf-mirror.com

  # The catalog database plus the remote-file cache disk, mounted at /server-data.
  # ⚠️ This is a StatefulSet volumeClaimTemplate: IMMUTABLE after creation. Changing size or class
  #    on an existing release makes `helm upgrade` fail, and `helm uninstall` deliberately leaves
  #    the PVC (server-data-rerun-cloud-0) behind — delete it by hand to reclaim the disk.
  storage:
    className: ebs-essd
    size: 100Gi

  resources:
    requests: { cpu: "1", memory: 2Gi }
    limits:   { cpu: "4", memory: 8Gi }

# The curation console: a separate StatefulSet, deliberately not a second container in the ReRun
# pod. Curation is CPU-heavy batch work, so keeping it apart means neither component drags the
# other down, and upgrading the viewer does not kill a curation run in flight.
curator:
  # false drops the console, its site-configuration ConfigMap and its Ingress path together.
  enabled: true

  # The console's image is image.curator (top-level, next to the rerun one).

  # The console's URL path is fixed at /curation (its --root-path, the Ingress route, and the
  # viewer's built-in Diagnose-button target are all this one value — the viewer derives it as a
  # same-origin sibling path, so there is nothing to configure and nothing to keep in sync).

  # The Terminal tab: an embedded web terminal on a real shell, behind the same Basic auth as the
  # rest of the console. Useful for triage. false does not render the tab and does not register the
  # /ws/term route — set it if handing out a shell is a concern.
  terminal: true

  # VLM backends the console offers for its model-based checks, rendered verbatim into the
  # console's site.yaml (keys and fields follow its format). There is no in-cluster discovery: a
  # backend that is not listed cannot be selected in the UI at all.
  # What belongs here are EXTERNAL, already-running vLLM or MaaS backends. The vLLM this chart can
  # deploy (vllm.enabled=true) is merged in automatically under the `self-hosted` key; an entry of
  # that name here wins over it.
  # Every backend needs at least an endpoint; the UI filters out entries whose endpoint is empty or
  # still contains "YOUR-". For example:
  #   vlmBackends:
  #     h20-8b:
  #       endpoint: http://vllm-cosmos-8b.<namespace>.svc.cluster.local:8000/v1
  #       model: nvidia/Cosmos-Reason2-8B
  #       api_key_env:
  #       hardware: NVIDIA H20
  #       service_type: Self-hosted vLLM
  vlmBackends: {}

  # Base url of the Volcengine Ark VLM service, injected as the console's ARK_BASE_URL. Ordinary
  # configuration, not a secret — the matching key is `ark_api_key` in secrets.existingSecret.
  # Empty = not injected, which is correct when the console does not use the Ark backend.
  arkBaseUrl: https://ark.cn-beijing.volces.com/api/v3

  # The curation pipeline is CPU-bound: optical flow, video decoding and the checks themselves all
  # run on CPU.
  # ⚠️ ephemeral-storage is what enables the size precheck. The dataset cache and batch staging
  #    live in an emptyDir, which counts against this limit, and the console reads the limit through
  #    the downward API to work out how much it can still write — without it, a large dataset can
  #    write the pod into a kubelet eviction. Tune it to the node's disk.
  resources:
    requests: { cpu: "2", memory: 4Gi }
    limits:   { cpu: "8", memory: 16Gi, ephemeral-storage: 50Gi }

# An optional self-hosted vLLM for the console's model-based checks, as a separate Deployment in
# the same namespace. OFF by default: it needs a GPU, and the console works without it.
# Turning it on also registers the endpoint in the console's backend list automatically (under the
# `self-hosted` key), so it is selectable in the UI without anyone copying an in-cluster DNS name.
vllm:
  enabled: false

  image:
    # The official OpenAI-compatible server image, pulled through the daocloud proxy.
    repository: docker.m.daocloud.io/vllm/vllm-openai
    tag: latest
    pullPolicy: IfNotPresent

  # What vLLM loads. Empty = derived: with weightFetch on (the default) this becomes the prefetch
  # landing path /models/<weightFetch.modelName>, so changing the model only means changing
  # modelName. With weightFetch off it is REQUIRED — write the HF repo id for vLLM to pull itself
  # (pair it with the Secret's hf_token key plus catalog.hfEndpoint). An explicit value always
  # wins, e.g. a path to weights the image already carries.
  model: ""

  # The model name the OpenAI-compatible API advertises, and the name the console sends requests
  # under — the two have to match, which is why the registered backend's `model` field is taken
  # from here. Empty = use `model` itself, which makes for an ugly name when that is a local path.
  servedModelName: nvidia/Cosmos-Reason2-32B

  # Extra vLLM arguments. --model, --served-model-name and --port are assembled by the chart; do
  # not repeat them.
  # These are sized for one 32B model on a single 96GB GPU: fp16 weights are ~64GB, so memory
  # utilization goes to 0.92 and the context down to 32768, leaving ~20GB for the KV cache. If that
  # OOMs, or the context is too small, move to two GPUs (gpuCount: 2) and add
  # --tensor-parallel-size 2.
  extraArgs:
    - --gpu-memory-utilization
    - "0.8"
    - --max-model-len
    - "32768"
    - --trust-remote-code

  port: 8000

  # GPU count. This is resources.limits."nvidia.com/gpu" — do not also set it under resources.
  gpuCount: 1

  # Pin to one GPU node by its kubernetes.io/hostname. Empty = unpinned, and the scheduler picks
  # any node that satisfies the GPU request, which is usually what you want.
  nodeHostname: ""
  # Extra scheduling constraints, for picking a GPU model or tolerating GPU taints.
  nodeSelector: {}
  tolerations: []

  # /dev/shm, needed for tensor parallelism and large batches. Memory-backed, and worth being
  # generous with even on a single GPU.
  dshmSize: 16Gi

  # Weight prefetch: an initContainer that downloads the model onto the GPU node's local disk (an
  # emptyDir) before vLLM starts — not into the image, not onto TOS. It is idempotent, so a pod
  # rebuild skips the download. ON by default, so vllm.enabled=true works with no further values:
  # the defaults (this, modelName, model, servedModelName) all line up.
  # ⚠️ The download path is Volcengine-internal (oniond plus the ivolces mirrors). On a cluster
  #    outside that network, set enabled=false — vLLM then pulls the model from HuggingFace itself
  #    (write an HF repo id into vllm.model, and see the Secret's hf_token key plus
  #    catalog.hfEndpoint).
  weightFetch:
    enabled: true
    # The DOWNLOAD container's image (not the one vLLM runs on): any Debian image that can install
    # oniond and run aria2. Empty = reuse image.curator, which already can — the usual choice.
    # Fill in a full reference only to use something else.
    image: ""
    # The bucket oniond downloads from.
    bucket: ai-infra
    # The model oniond downloads (`oniond download model <modelName> --dir /models`). The weights
    # land in /models/<modelName>, which is what `model` above must point at.
    modelName: Cosmos-Reason2-32B

  # CPU and memory only — the GPU is counted separately through gpuCount. The weights go into an
  # emptyDir, so a large model eats ephemeral-storage: set a limit for it here when that matters,
  # or the node's kubelet may evict the pod.
  resources:
    requests: { cpu: "2", memory: 8Gi }

# The public HTTPS entry point, through Volcengine APIG. The gateway terminates TLS on an
# auto-assigned *.volceapi.com domain and routes by host and path: `/` to the viewer,
# /curation to the console, the catalog's HTTP and gRPC paths to the catalog server.
#
# Authentication deliberately does not happen at the gateway — a gateway-level JWT would make the
# pages unopenable in a browser. The backends authenticate instead, which is why the chart refuses
# to publish anything with web.basicAuth or catalog.tokenAuth turned off.
#
# ⚠️ Requires the APIGInstance CRD (loadbalancer.vke.volcengine.com/v1beta1), which the Volcengine
#    VKE platform installs. An install failing with "no matches for kind APIGInstance" does not
#    have it: set apig.enabled=false and bring your own ingress.
apig:
  enabled: true

  # Two ways to get a gateway, matching the APIGInstance CRD's own two modes:
  #   create: false -> ADOPT an existing gateway (the CRD sets spec.id). Put its instance id, from
  #                    the APIG console, in existingId, and ingressClassName MUST match the class
  #                    that gateway declares or it will never claim the Ingresses.
  #   create: true  -> PROVISION a new one (the CRD sets spec.name + spec.common). subnetIds is
  #                    then REQUIRED and must be in this cluster's VPC. Takes a few minutes, and
  #                    bills.
  #
  # ⚠️ With create=true, leave existingId EMPTY and keep it empty. The provisioned gateway reports
  #    its id in the APIGInstance's status.id, and the Ingresses bind by ingress class, so nothing
  #    has to be fed back. Writing existingId sets spec.id, which the CRD treats as immutable: the
  #    admission webhook then rejects every later upgrade with
  #      spec.id: Forbidden: forbidden to update, old: , new: <id>
  #    and the release stays failed until the value is removed again.
  # ⚠️ A gateway this chart provisioned is DELETED by `helm uninstall`, taking its auto-assigned
  #    *.volceapi.com domain with it — a new one comes back under a different name. Adopt an
  #    existing gateway for anything whose URL people have bookmarked.
  create: false

  # create=true only: keep the provisioned gateway when the release is uninstalled, instead of
  # deleting it along with its *.volceapi.com domain. Turn it on BEFORE you need it — Helm decides
  # what to retain from the manifest recorded in the release, so annotating the live object after
  # the fact has no effect and the gateway still goes.
  retainOnDelete: false

  existingId: ""                  # create=false: REQUIRED, the gateway's instance id
  instanceName: ""                # create=true: gateway name (default: <release>-apig)
  # create=true: REQUIRED, at least one. The gateway is replicated for HA, so prefer two subnets in
  # DIFFERENT availability zones and the platform spreads the replicas and their CLB across them.
  # All of them must belong to THIS cluster's VPC — a subnet copied from another cluster fails with
  # "cannot be found from VPC" and stays Pending forever. To find them, copy the
  # volcengine-loadbalancer-subnet-id annotation off any healthy LoadBalancer Service in this
  # cluster.
  #   subnetIds:
  #     - subnet-aaaa   # availability zone A
  #     - subnet-bbbb   # availability zone B
  subnetIds: []

  # Gateway sizing. ALL OPTIONAL, and empty means "let the platform choose" — which is the right
  # default. Fill in only what you deliberately want to control. Recommended if you do:
  # instanceSpecCode 1c2g (IPv4), publicNetworkBillingType traffic (pay for what you use), and a
  # 200 Mbps cap — the gateway proxies UI and API traffic, never dataset bytes (clients read those
  # from TOS directly, through presigned URLs).
  replicas: ""                    # gateway replicas — more than one is HA, and costs it
  instanceSpecCode: ""            # e.g. 1c2g
  clbSpecCode: ""                 # e.g. small_1
  publicNetworkBillingType: ""    # e.g. traffic
  publicNetworkBandwidth: ""      # Mbps, e.g. 200

  # One gateway per ingress class: pointing two releases at the same class routes them to one
  # gateway. Normally leave this EMPTY — create=true names the class itself (<release>-apig), and
  # create=false resolves it from the cluster during install/upgrade: the adopted gateway's
  # APIGInstance declares its classes, and this chart takes the one whose id matches existingId
  # (a wrong id fails the install with the list of gateways). Set it explicitly only to render
  # offline (helm template without a cluster), or to override the resolution.
  # The rerun-native-session chart hangs its own Ingress off this same class, so whatever this
  # resolves to is what that chart's ingress.className has to be set to — the resolved value is
  # printed in this chart's install notes.
  ingressClassName: ""

  # Internal placeholder host, never public DNS — it is only the key APIG routes on, and each
  # distinct host is what earns its own managed *.volceapi.com domain. Every route in this chart
  # shares it, which is what puts the viewer, the console and the catalog on ONE domain.
  # Must not collide with a host already registered on the same gateway.
  # ⚠️ Never put the auto-assigned *.volceapi.com name here.
  # ⚠️ Changing it after deployment does not apply cleanly in place — the Ingress keeps its old
  #    ADDRESS — and it means a new public domain, so bookmarks and bucket CORS rules follow.
  host: ""                        # default: <release>-web.apig.internal
  annotations: {}                 # binding annotations are added automatically from existingId
