{{/*
Publishes everything the deployment exposes, on ONE host: the platform issues one managed
*.volceapi.com domain per host, so a single host is what puts the viewer, the curation console and
the catalog on the same public domain.

Two Ingress objects, not one, because the backend-protocol annotation applies to a whole Ingress:
the plain-HTTP routes below must not be forwarded as gRPC.

With web.basePath set (e.g. /rerun) the whole ReRun site is that ONE HTTP route: the web container's
nginx serves the viewer under it and forwards the catalog's plain-HTTP endpoints itself, so the
domain root and every other path stay free for whatever else shares the host. Empty keeps the
original layout (viewer at /, the catalog's HTTP paths routed to it directly).
*/}}
{{- include "dataverse.apig.validate" . -}}
{{- if .Values.apig.enabled }}
{{- $basePath := include "dataverse.web.basePath" . }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "dataverse.fullname" . }}-web
  labels:
    {{- include "dataverse.labels" . | nindent 4 }}
  {{- with (include "dataverse.apig.annotations" . | trim) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ include "dataverse.apig.ingressClassName" . }}
  rules:
    - host: {{ include "dataverse.apig.host" . | quote }}
      http:
        paths:
          {{- if $basePath }}
          # The whole ReRun site under one prefix, forwarded unchanged (no rewrite): the viewer and
          # its files, plus <basePath>/api, /catalog and /version, which nginx hands to the catalog.
          - path: {{ $basePath }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "dataverse.rerunName" . }}-web
                port:
                  number: 80
          {{- else }}
          # The catalog's plain-HTTP endpoints, on the same domain (HTTP/1.1 through the gateway):
          #   /api       same-origin calls from the browser (ensure-cors, the HF cache proxy)
          #   /catalog   presign / sources, which is what direct reads during training use
          #   /version   unauthenticated health check
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "dataverse.rerunName" . }}-headless
                port:
                  number: 51234
          - path: /catalog
            pathType: Prefix
            backend:
              service:
                name: {{ include "dataverse.rerunName" . }}-headless
                port:
                  number: 51234
          - path: /version
            pathType: Prefix
            backend:
              service:
                name: {{ include "dataverse.rerunName" . }}-headless
                port:
                  number: 51234
          {{- end }}
          {{- if .Values.curator.enabled }}
          # One domain, split by path: /curation is the curation console. The gateway does not strip
          # the prefix — the console registers all of its routes under that path itself
          # (CURATOR_BASE_PATH). The viewer finds it there on its own at the root layout, and through
          # DAFT_URL (set by the chart) under a basePath.
          - path: /curation
            pathType: Prefix
            backend:
              service:
                name: {{ include "dataverse.fullname" . }}-curation
                port:
                  number: 8080
          {{- end }}
          {{- if not $basePath }}
          # Everything else: the web viewer.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "dataverse.rerunName" . }}-web
                port:
                  number: 80
          {{- end }}
---
# The catalog's gRPC entry point, on the same host. A gRPC method path carries the fully qualified
# service name as its prefix (/rerun.cloud.v1alpha1.RerunCloudService/…), so it cannot collide with
# the viewer or the console. It stays at the origin root even with web.basePath set: rerun's
# catalog clients (SDK and viewer) address a server by origin only, `rerun+https://<domain>:443`,
# with no room for a path prefix.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "dataverse.fullname" . }}-catalog-grpc
  labels:
    {{- include "dataverse.labels" . | nindent 4 }}
  annotations:
    {{- with (include "dataverse.apig.annotations" . | trim) }}
    {{- . | nindent 4 }}
    {{- end }}
    # Make the gateway forward to the upstream as gRPC (HTTP/2). APIG decides the protocol mainly
    # from the Service port: the backend below points at headless's `grpc` port (name=grpc /
    # appProtocol=grpc, see services-rerun.yaml), so APIG picks HTTP/2 on its own. This annotation
    # is belt-and-suspenders — on its own it is unreliable in the APIG adapter, degrading to
    # HTTP/1.1, and the gRPC backend then answers HTTP 400 "grpc-status missing".
    nginx.ingress.kubernetes.io/backend-protocol: "GRPC"
    # Long calls such as bulk registration outlast the gateway's default 60s — widen it to 10
    # minutes.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
spec:
  ingressClassName: {{ include "dataverse.apig.ingressClassName" . }}
  rules:
    - host: {{ include "dataverse.apig.host" . | quote }}
      http:
        paths:
          - path: /rerun.cloud.v1alpha1.RerunCloudService
            pathType: Prefix
            backend:
              service:
                name: {{ include "dataverse.rerunName" . }}-headless
                # Reference by NUMBER, not name: the APIG controller's CreateUpstream API requires a
                # numeric K8SService.Port (a named port fails with
                # MissingParameter.UpstreamSpec.K8SService.Port). 51235 is the `grpc` Service port
                # (appProtocol=grpc → APIG builds an HTTP/2 upstream).
                port:
                  number: 51235
{{- end }}
