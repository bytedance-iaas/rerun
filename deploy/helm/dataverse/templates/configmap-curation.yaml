{{- if .Values.curator.enabled }}
{{/*
Site configuration for the curation console: the set of VLM backends the UI offers, and the public
datasets mirror bucket. Work buckets and prefixes are runtime input, so the deployment never
declares "these are the buckets we are wired to" — the one bucket configured here is the read-only
public mirror, which is a deployment constant.

The console has no in-cluster discovery — the only backends it offers are the ones listed here — so
the vLLM this chart can deploy (vllm.enabled=true) has to be injected to be selectable at all. It is
merged in under the `self-hosted` key, with its endpoint pointing at the vLLM Service's in-cluster
DNS name and ending in /v1. External backends from curator.vlmBackends are merged in as well, and
win on a name clash.

After changing values, `helm upgrade`: the checksum annotation on the curation pod rolls it so the
new configuration takes effect.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dataverse.fullname" . }}-curation-site
  labels:
    {{- include "dataverse.labels" . | nindent 4 }}
    app.kubernetes.io/component: curation
data:
  site.yaml: |
    {{- $backends := deepCopy (.Values.curator.vlmBackends | default dict) }}
    {{- if .Values.vllm.enabled }}
    {{- $endpoint := printf "http://%s-vllm.%s.svc.cluster.local:%v/v1" (include "dataverse.fullname" .) .Release.Namespace (.Values.vllm.port | int) }}
    {{- $auto := dict "endpoint" $endpoint "model" (.Values.vllm.servedModelName | default .Values.vllm.model) "service_type" "自托管" }}
    {{- /* curator.vlmBackends wins: a user-defined `self-hosted` entry is kept as-is */}}
    {{- $backends = merge $backends (dict "self-hosted" $auto) }}
    {{- end }}
    {{- if $backends }}
    vlm_backends:
      {{- toYaml $backends | nindent 6 }}
    {{- end }}
    {{- $pd := .Values.curator.publicDatasets | default dict }}
    {{- if $pd.bucket }}
    {{- /* The console reads bucket + region and registers the bucket for anonymous (unsigned)
           access; prefix/manifest/label have console-side defaults and are only rendered when
           overridden. */}}
    public_datasets:
      bucket: {{ $pd.bucket | quote }}
      region: {{ $pd.region | default .Values.tos.region | quote }}
      {{- with $pd.prefix }}
      prefix: {{ . | quote }}
      {{- end }}
      {{- with $pd.manifest }}
      manifest: {{ . | quote }}
      {{- end }}
      {{- with $pd.label }}
      label: {{ . | quote }}
      {{- end }}
    {{- end }}
    {{- if and (not $backends) (not $pd.bucket) }}
    {}
    {{- end }}
{{- end }}
