{{- if and .Values.catalog.tokenAuth.enabled (not .Values.secrets.existingTokenSecret) }}
# The signing secret for catalog tokens, kept in a Secret of its own: it is
# mounted into the catalog container alone, as a 0400 file, so neither the web
# nor the native session can see it. Preferably create it straight through a
# kubectl pipe (never touching disk or helm values) and point
# secrets.existingTokenSecret at it; this template is the development fallback
# for filling the value in directly.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dataverse.fullname" . }}-token-secret
  labels:
    {{- include "dataverse.labels" . | nindent 4 }}
type: Opaque
stringData:
  server_token_secret: {{ required "catalog.tokenAuth.enabled=true needs a signing secret: create the Secret with kubectl and set secrets.existingTokenSecret, or fill in secrets.serverTokenSecret; to turn authentication off, set catalog.tokenAuth.enabled=false explicitly" .Values.secrets.serverTokenSecret | quote }}
{{- end }}
