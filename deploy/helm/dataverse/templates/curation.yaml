{{- if .Values.curator.enabled }}
{{/*
The curation console (curator v2): one process, the API Daemon `curator-daemon`, hosting the web
console in-process and driving the QA CLI as child processes. Contract: the curator repo's
docs/design/09-deployment.md §2 — the env table below is the agreed interface between this chart
and the Daemon (its test_env_contract.py checks the other side).

A StatefulSet of its own, deliberately not a third container in the ReRun pod: curation is
CPU-heavy batch work, so keeping it apart means neither component drags the other down, and
upgrading the viewer does not kill a curation run in flight. StatefulSet rather than Deployment
because the data disk is RWO block storage and SQLite tolerates exactly one writer: stop-then-start
ordering is the point.

Two block-storage disks (both MUST be EBS — SQLite's WAL corrupts on NAS/FSX, and FSX refuses the
random writes PyAV needs):
  /data     SQLite + task workspaces + library snapshots   (survives restarts)
  /scratch  export temp files + local copies of mcap/Lance  (disposable)

TOS and VLM credentials are NOT injected: the user adds access keys and API keys in the console's
own UI, encrypted at rest with the master key (curator_master_key in the shared Secret — the one
key this pod reads that no other component mounts).
*/}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "dataverse.fullname" . }}-curation
  labels:
    {{- include "dataverse.labels" . | nindent 4 }}
    app.kubernetes.io/component: curation
spec:
  serviceName: {{ include "dataverse.fullname" . }}-curation
  replicas: 1
  selector:
    matchLabels:
      {{- include "dataverse.selectorLabels" (dict "root" . "component" "curation") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dataverse.selectorLabels" (dict "root" . "component" "curation") | nindent 8 }}
      annotations:
        # Rolls the pod when the site configuration changes. Secret contents are invisible to the
        # chart, so a rotated master key or account table needs `kubectl rollout restart` instead.
        checksum/site-config: {{ include (print $.Template.BasePath "/configmap-curation.yaml") . | sha256sum }}
        {{- with (include "dataverse.vciAnnotations" .) }}
        {{- . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      # The Daemon on SIGTERM: stop taking tasks, let running CLI children finish their current
      # episode (up to 90s), persist tasks as paused(system), exit. preStop gives the Service and
      # the gateway 5s to drop the endpoint first; 120s covers the whole sequence.
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      {{- if .Values.vci.enabled }}
      # VCI does not execute fsGroup, so the freshly-provisioned disks arrive root-owned and the
      # non-root Daemon could not write them: a root init container hands both over once.
      initContainers:
        - name: chown-disks
          image: {{ include "dataverse.curator.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          command: ["sh", "-c", "chown 10001:10001 /data /scratch"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: scratch
              mountPath: /scratch
      {{- end }}
      containers:
        - name: curation
          # No args: the image entrypoint starts `curator-daemon` by itself.
          image: {{ include "dataverse.curator.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            # Served under this prefix — the Ingress route, and the path the viewer's Diagnose
            # buttons derive as a same-origin sibling. One value, fixed, nowhere to drift; the
            # gateway does not strip it and the Daemon registers all routes beneath it.
            - name: CURATOR_BASE_PATH
              value: /curation
            {{- with .Values.curator.publicBaseUrl }}
            # Base of the absolute links handed to agents; unset = relative links.
            - name: CURATOR_PUBLIC_BASE_URL
              value: {{ . | quote }}
            {{- end }}
            - name: CURATOR_DATA_DIR
              value: /data
            - name: CURATOR_SCRATCH_DIR
              value: /scratch
            - name: CURATION_EXPORT_SCRATCH
              value: /scratch
            # Local copies of TOS-hosted mcap / Lance datasets live on the disposable disk —
            # never the data disk, where filling up would stall SQLite.
            - name: CURATOR_SOURCE_CACHE_DIR
              value: /scratch/source-cache
            - name: CURATION_CONFIG
              value: /etc/curator/site/site.yaml
            # The Daemon reads only two facts out of it — the region and internal-vs-public —
            # and swaps endpoints per bucket itself. Internal form: the pod sits in the VPC.
            - name: TOS_ENDPOINT
              value: {{ include "dataverse.tos.endpointInternal" . | quote }}
            {{- if .Values.web.basicAuth.enabled }}
            # Shares the htpasswd account table with the web viewer: same domain, one login opens
            # both (the Daemon's Basic-auth realm is fixed to match).
            - name: CURATOR_AUTH_MODE
              value: htpasswd
            - name: CURATOR_HTPASSWD_FILE
              value: /etc/curator/auth/htpasswd
            {{- else }}
            # Only reachable in private-network deployments: the chart refuses to render a
            # public (APIG) entry with Basic auth off.
            - name: CURATOR_AUTH_MODE
              value: none
            {{- end }}
            # The master key encrypting every credential the console stores (TOS access keys,
            # VLM API keys). Deliberately NOT optional: without it the Daemon refuses to start
            # anyway (exit 2), and a missing-key error on the pod says so sooner and clearer.
            # No other component mounts this key.
            - name: CURATOR_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "dataverse.viewerSecretName" . }}
                  key: curator_master_key
            # Rotation pair (curator repo deploy/README.md §7): both absent outside a rotation.
            - name: CURATOR_MASTER_KEY_NEXT
              valueFrom:
                secretKeyRef:
                  name: {{ include "dataverse.viewerSecretName" . }}
                  key: curator_master_key_next
                  optional: true
            - name: CURATOR_MASTER_KEY_VERSION
              valueFrom:
                secretKeyRef:
                  name: {{ include "dataverse.viewerSecretName" . }}
                  key: curator_master_key_version
                  optional: true
            {{- with .Values.curator.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # /healthz: the process is up (no dependency checks). /readyz: DB writable, master key
          # loaded, work dirs writable, startup reconciliation done. Both unauthenticated (a 401
          # here restart-loops the pod — learned in v1). Startup gets five minutes: schema
          # migration and task-state reconciliation run first.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 60
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          resources:
            {{- toYaml .Values.curator.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: scratch
              mountPath: /scratch
            {{- if .Values.web.basicAuth.enabled }}
            - name: curation-auth
              mountPath: /etc/curator/auth
              readOnly: true
            {{- end }}
            - name: site-config
              mountPath: /etc/curator/site
      volumes:
        {{- with .Values.curator.persistence.data.existingClaim }}
        # Adopting a pre-existing data disk (e.g. from a standalone release): the claim is used
        # as-is and the `data` claim template below is skipped.
        - name: data
          persistentVolumeClaim:
            claimName: {{ . }}
        {{- end }}
        {{- if .Values.web.basicAuth.enabled }}
        - name: curation-auth
          secret:
            secretName: {{ include "dataverse.viewerSecretName" . }}
            items:
              - key: web_htpasswd
                path: htpasswd
        {{- end }}
        - name: site-config
          configMap:
            name: {{ include "dataverse.fullname" . }}-curation-site
  # Claim templates cannot be changed after creation: to grow a disk, patch the PVC directly
  # (the storage class must allow expansion) and leave these values alone.
  volumeClaimTemplates:
    {{- if not .Values.curator.persistence.data.existingClaim }}
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.curator.persistence.data.className }}
        resources:
          requests:
            storage: {{ .Values.curator.persistence.data.size }}
    {{- end }}
    - metadata:
        name: scratch
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.curator.persistence.scratch.className }}
        resources:
          requests:
            storage: {{ .Values.curator.persistence.scratch.size }}
---
# The backend behind the console's Ingress path, and at the same time the StatefulSet's governing
# service. Headless is enough — the APIG Ingress forwards to endpoints.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dataverse.fullname" . }}-curation
  labels:
    {{- include "dataverse.labels" . | nindent 4 }}
    app.kubernetes.io/component: curation
spec:
  clusterIP: None
  selector:
    {{- include "dataverse.selectorLabels" (dict "root" . "component" "curation") | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- end }}
