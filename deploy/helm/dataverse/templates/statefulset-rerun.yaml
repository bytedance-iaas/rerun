{{/*
The ReRun workload: the web viewer and the catalog server, in one pod, two containers. They ship in
the same image (MODE=web / MODE=server) and are always upgraded together, so splitting them into
two workloads would only add a second rollout to keep in step.

A StatefulSet rather than a Deployment: the catalog's database and cache live on an RWO cloud disk,
and a StatefulSet guarantees at most one instance has it mounted at a time — a node failure will not
bring up a second pod fighting for the same disk.

⚠️ A StatefulSet's selector is IMMUTABLE: the selector labels cannot change once this ships.
*/}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "dataverse.rerunName" . }}
  labels:
    {{- include "dataverse.labels" . | nindent 4 }}
    app.kubernetes.io/component: rerun
spec:
  serviceName: {{ include "dataverse.rerunName" . }}-headless
  replicas: 1
  selector:
    matchLabels:
      {{- include "dataverse.selectorLabels" (dict "root" . "component" "rerun") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dataverse.selectorLabels" (dict "root" . "component" "rerun") | nindent 8 }}
    spec:
      # Secrets are mounted at /run/secrets; SA-token automounting is off so it cannot collide with
      # the read-only secret volume.
      # ⚠️ Their contents are invisible to the chart, so editing a Secret does not roll this pod.
      #    `kubectl rollout restart` is what picks up rotated credentials.
      automountServiceAccountToken: false
      containers:
        # ---- Container 1: the web viewer (nginx + wasm + /config.json) ----
        - name: web
          image: {{ include "dataverse.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: MODE
              value: web
            # This endpoint is handed to the user's browser, which sits on the public internet — it
            # has to be the public one. (No TOS_REGION: the viewer derives the region from the
            # endpoint hostname.)
            - name: TOS_ENDPOINT
              value: {{ include "dataverse.tos.endpointPublic" . | quote }}
            {{- with .Values.catalog.hfEndpoint }}
            # Handed to the browser via /config.json, so browser-side Hugging Face reads use the
            # same mirror as the in-cloud components. Empty = the official huggingface.co.
            - name: HF_ENDPOINT
              value: {{ . | quote }}
            {{- end }}
            - name: TOS_RRD_ARTIFACTS_URL
              value: {{ .Values.tos.rrdArtifactsUrl | quote }}
            - name: RRD_ARTIFACTS_PREFETCH
              value: {{ .Values.web.rrdArtifactsPrefetch | quote }}
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /healthz # Unauthenticated health endpoint (with Basic auth on, / returns 401)
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          volumeMounts:
            - name: tos-secrets
              mountPath: /run/secrets
              readOnly: true
            - name: rrd-cache
              mountPath: /rrd-cache

        # ---- Container 2: the catalog server ----
        - name: catalog
          image: {{ include "dataverse.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: MODE
              value: server
            # The server runs inside the cloud, so reaching TOS over the internal endpoint is faster
            # and bills no public traffic.
            - name: TOS_ENDPOINT
              value: {{ include "dataverse.tos.endpointInternal" . | quote }}
            - name: TOS_REGION
              value: {{ include "dataverse.tos.region" . | quote }}
            # Which network the presigned URLs are signed for (catalog.presignNetwork). This affects
            # only the URLs handed to clients, not how the server itself reaches TOS.
            - name: RERUN_PRESIGN_ENDPOINT
              value: {{ include "dataverse.presignEndpoint" . | quote }}
            {{- with .Values.catalog.hfEndpoint }}
            - name: HF_ENDPOINT
              value: {{ . | quote }}
            {{- end }}
            # Self-service bucket CORS (/api/ensure-cors): when the viewer opens a new bucket, the
            # server fills in that bucket's CORS rules — appending only, never overwriting rules
            # someone else put there.
            - name: RERUN_AUTO_CORS
              value: {{ .Values.catalog.autoCors.enabled | ternary "1" "0" | quote }}
            {{- with .Values.catalog.autoCors.origins }}
            - name: RERUN_AUTO_CORS_ORIGINS
              value: {{ join "," . | quote }}
            {{- end }}
            # The token-signing secret deliberately skips the environment (env shows up in the
            # process environment, visible to `kubectl exec env`): it is projected into /run/secrets
            # as a 0400 file and the entrypoint discovers it there.
          ports:
            - containerPort: 51234
          readinessProbe:
            tcpSocket:
              port: 51234
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.catalog.resources | nindent 12 }}
          volumeMounts:
            - name: catalog-secrets
              mountPath: /run/secrets
              readOnly: true
            - name: server-data
              mountPath: /server-data
      volumes:
        # One Secret carries every credential (see values.yaml `secrets:`). Both containers mount
        # it at /run/secrets; the catalog volume tightens the file mode for the signing key it
        # holds. Keys a mode does not read are simply never opened by its entrypoint.
        - name: tos-secrets
          secret:
            secretName: {{ include "dataverse.viewerSecretName" . }}
        - name: catalog-secrets
          secret:
            secretName: {{ include "dataverse.viewerSecretName" . }}
            defaultMode: 256 # 0400, owner-readable only — this mount includes server_token_secret
        - name: rrd-cache
          emptyDir: {} # nginx's WebDAV write-back directory (a fallback path); losing it costs nothing
  # The catalog database plus the remote-file cache. Losing it is survivable — the server re-fetches
  # from TOS — but the catalog's registration records live here too, so keep it.
  # ⚠️ IMMUTABLE after creation: changing size or storageClassName fails the upgrade. And
  #    `helm uninstall` does not delete this PVC; remove it by hand to reclaim the disk.
  volumeClaimTemplates:
    - metadata:
        name: server-data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.catalog.storage.className | quote }}
        resources:
          requests:
            storage: {{ .Values.catalog.storage.size | quote }}
