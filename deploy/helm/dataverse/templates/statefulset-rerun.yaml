# A StatefulSet rather than a Deployment: the catalog's database and cache live
# on an RWO cloud disk, and a StatefulSet guarantees at most one instance has it
# mounted at a time (a node failure will not bring up a second pod fighting for
# the disk).
# Note: a StatefulSet's selector is immutable — selectorLabels cannot change
# once this ships.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "dataverse.fullname" . }}
  labels:
    {{- include "dataverse.labels" . | nindent 4 }}
    app.kubernetes.io/component: rerun
spec:
  serviceName: {{ include "dataverse.fullname" . }}-headless
  replicas: 1
  selector:
    matchLabels:
      {{- include "dataverse.selectorLabels" (dict "root" . "component" "rerun") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dataverse.selectorLabels" (dict "root" . "component" "rerun") | nindent 8 }}
      annotations:
        # Rolls the pod automatically when the secret contents change; with
        # existingSecret the chart cannot see them, so restart by hand after editing.
        checksum/secrets: {{ print (include (print $.Template.BasePath "/secret-viewer.yaml") .) (include (print $.Template.BasePath "/secret-token.yaml") .) | sha256sum }}
    spec:
      # Secrets are mounted at /run/secrets; SA-token automounting is off so it
      # cannot collide with the read-only secret volume.
      automountServiceAccountToken: false
      containers:
        # ---- Container 1: web viewer (nginx + wasm + /tos-config.json) ----
        - name: web
          image: {{ required "image.rerun is required (the rerun image reference)" .Values.image.rerun | quote }}
          env:
            - name: MODE
              value: web
            # In web mode this endpoint is handed to the user's browser, which
            # sits on the public internet — it has to be the public endpoint.
            - name: TOS_ENDPOINT
              value: {{ .Values.tos.endpointPublic | quote }}
            - name: TOS_REGION
              value: {{ .Values.tos.region | quote }}
            - name: TOS_RRD_ARTIFACTS_URL
              value: {{ .Values.tos.rrdArtifactsUrl | quote }}
            - name: RRD_ARTIFACTS_PREFETCH
              value: {{ .Values.web.rrdArtifactsPrefetch | quote }}
            {{- with .Values.web.daftUrl }}
            - name: DAFT_URL
              value: {{ . | quote }}
            {{- end }}
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /healthz # Unauthenticated health endpoint (with Basic auth on, / returns 401)
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          volumeMounts:
            - name: tos-secrets
              mountPath: /run/secrets
              readOnly: true
            - name: rrd-cache
              mountPath: /rrd-cache

        # ---- Container 2: catalog server ----
        - name: catalog
          image: {{ .Values.image.rerun | quote }}
          env:
            - name: MODE
              value: server
            # The server runs inside the cloud, so reaching TOS over the
            # internal endpoint is faster and bills no public traffic.
            - name: TOS_ENDPOINT
              value: {{ .Values.tos.endpointInternal | quote }}
            - name: TOS_REGION
              value: {{ .Values.tos.region | quote }}
            # Which endpoint presigned URLs are signed for (affects only the URLs handed to clients).
            - name: RERUN_PRESIGN_ENDPOINT
              value: {{ .Values.catalog.presignEndpoint | quote }}
            {{- with .Values.catalog.hfEndpoint }}
            - name: HF_ENDPOINT
              value: {{ . | quote }}
            {{- end }}
            # Self-service bucket CORS (/api/ensure-cors): when the viewer opens
            # a new bucket, the server fills in the bucket's CORS rules (append
            # only — it never overwrites someone else's).
            - name: RERUN_AUTO_CORS
              value: {{ .Values.catalog.autoCors.enabled | ternary "1" "0" | quote }}
            {{- with .Values.catalog.autoCors.origins }}
            - name: RERUN_AUTO_CORS_ORIGINS
              value: {{ join "," . | quote }}
            {{- end }}
            # The token-signing secret deliberately skips the environment (env
            # shows up in the process environment, visible to `kubectl exec env`):
            # it is projected into /run/secrets as a 0400 file and the entrypoint
            # discovers it.
          ports:
            - containerPort: 51234
          readinessProbe:
            tcpSocket:
              port: 51234
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.catalog.resources | nindent 12 }}
          volumeMounts:
            - name: catalog-secrets
              mountPath: /run/secrets
              readOnly: true
            - name: server-data
              mountPath: /server-data
      volumes:
        # The web container only ever sees the application credentials (AK/SK,
        # hf_token, account table) — the signing secret is not among them.
        - name: tos-secrets
          secret:
            secretName: {{ include "dataverse.viewerSecretName" . }}
        # The catalog container gets the signing secret projected into the same
        # directory, as a single 0400 file (owner-readable only).
        - name: catalog-secrets
          projected:
            sources:
              - secret:
                  name: {{ include "dataverse.viewerSecretName" . }}
              {{- if .Values.catalog.tokenAuth.enabled }}
              - secret:
                  name: {{ include "dataverse.tokenSecretName" . }}
                  items:
                    - key: server_token_secret
                      path: server_token_secret
                      mode: 256 # 0400
              {{- end }}
        - name: rrd-cache
          emptyDir: {} # nginx's WebDAV write-back directory (a fallback path); losing it costs nothing
  # The catalog database plus the remote-file cache. Losing it is survivable
  # (the server re-fetches from TOS), but the catalog's registration records live
  # here too, so keep it. helm uninstall does not delete this PVC.
  volumeClaimTemplates:
    - metadata:
        name: server-data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.catalog.storage.className | quote }}
        resources:
          requests:
            storage: {{ .Values.catalog.storage.size | quote }}
