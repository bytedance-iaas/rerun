{{- if not .Values.secrets.existingSecret }}
# Credentials shared by every pod. stringData is written in the clear and k8s
# base64-encodes it (encoding, not encryption).
# Semantics: a missing key means the matching feature is off (entrypoint decides
# by whether the file exists), so an optional value left empty simply does not
# render its key here.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dataverse.fullname" . }}-secrets
  labels:
    {{- include "dataverse.labels" . | nindent 4 }}
type: Opaque
stringData:
  tos_access_key: {{ required "secrets.tosAccessKey is required (or switch to secrets.existingSecret)" .Values.secrets.tosAccessKey | quote }}
  tos_secret_key: {{ required "secrets.tosSecretKey is required (or switch to secrets.existingSecret)" .Values.secrets.tosSecretKey | quote }}
  {{- with .Values.secrets.hfToken }}
  hf_token: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.arkApiKey }}
  # Volcengine Ark API key, injected into the curation console as ARK_API_KEY (see daft-curation.yaml).
  ark_api_key: {{ . | quote }}
  {{- end }}
  {{- if .Values.web.basicAuth.enabled }}
  # The web viewer (nginx) and the Daft curation console share this account
  # table, so one login gets you into both.
  web_htpasswd: {{ required "web.basicAuth.enabled=true requires secrets.webHtpasswd (one `username:password-hash` per line); to turn authentication off, set web.basicAuth.enabled=false explicitly" .Values.secrets.webHtpasswd | quote }}
  {{- end }}
{{- end }}
