{{- if .Values.apig.enabled }}
# 前提:集群里有 APIGInstance CRD(loadbalancer.vke.volcengine.com/v1beta1,
# 火山引擎 VKE 平台侧安装)。安装报 "no matches for kind APIGInstance" 就是缺它;
# 不在 VKE 上或自备入口时,设 apig.enabled=false。
# APIG 网关:HTTPS 终结(自带 *.volceapi.com 域名和证书)+ 按 host/路径分流。
# 认证不在网关做(网关 JWT 会挡浏览器直接打开页面),在后端做。
apiVersion: loadbalancer.vke.volcengine.com/v1beta1
kind: APIGInstance
metadata:
  name: {{ include "dataverse.fullname" . }}-apig-instance
  labels:
    {{- include "dataverse.labels" . | nindent 4 }}
spec:
  {{- if .Values.apig.existingInstanceId }}
  # 适配已有网关实例,不新建:网关和它的前置 CLB 都已就位,所以不需要 subnetId。
  id: {{ .Values.apig.existingInstanceId | quote }}
  {{- else }}
  # 新建网关:平台要在子网里起网关实例 + 前置 CLB,这就是「只有新建才要 subnetIds」的原因。
  # 网关是多副本高可用,给 2 个不同可用区的子网,平台把副本 + CLB 摊到多可用区。
  common:
    network:
      {{- if not .Values.apig.subnetIds }}
      {{- fail "apig.subnetIds 必填(新建 APIG 网关所在子网,至少一个;高可用建议给 2 个不同可用区的子网,须都在当前集群 VPC 内;若要适配已有网关请改设 apig.existingInstanceId)" }}
      {{- end }}
      subnetIds:
        {{- toYaml .Values.apig.subnetIds | nindent 8 }}
    # resource: 省略 => 平台默认(实测 small_1 CLB / 1c2g / 2 副本)。
  {{- end }}
  name: {{ include "dataverse.fullname" . }}-apig
  ingress:
    enable: true
    enableAllNamespaces: false
    # 本实例专属的 ingressClass,从 release 名派生,避免与集群里其他 APIG 实例
    # 抢同一个 class(两个实例声明同一个 class 会互相抢 Ingress)。
    ingressClasses: [{{ include "dataverse.ingressClassName" . }}]
    watchNamespaces: [{{ .Release.Namespace }}]
---
# Web viewer 的入口:host 独享一个自动分配的 *.volceapi.com 域名。
# host 只是网关内部的分流键,不需要真实 DNS。
# ⚠️ 改 host 或换 ingressClass 时 in-place apply 不干净(ADDRESS 残留旧 IP):
#   删掉这个 Ingress 再 helm upgrade。
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "dataverse.fullname" . }}-web
  labels:
    {{- include "dataverse.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ include "dataverse.ingressClassName" . }}
  rules:
    - host: {{ include "dataverse.webHost" . }}
      http:
        paths:
          # catalog 的纯 HTTP 端点,同域直达(HTTP/1.1 过网关):
          #   /api      浏览器同域调用(ensure-cors 等)
          #   /catalog  presign / sources(训练直读要用)
          #   /version  免认证健康检查
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "dataverse.fullname" . }}-headless
                port:
                  number: 51234
          - path: /catalog
            pathType: Prefix
            backend:
              service:
                name: {{ include "dataverse.fullname" . }}-headless
                port:
                  number: 51234
          - path: /version
            pathType: Prefix
            backend:
              service:
                name: {{ include "dataverse.fullname" . }}-headless
                port:
                  number: 51234
          {{- if .Values.daft.enabled }}
          # 同域名按路径分流:/curation = Daft 质检台,其余 = web viewer。
          # 网关不剥前缀,质检台自己把全部路由注册在 /curation 下(--root-path)。
          # viewer 的 Diagnose 按钮缺省就指向同域 /curation。
          - path: {{ .Values.daft.rootPath }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "dataverse.fullname" . }}-curation
                port:
                  number: 7860
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "dataverse.fullname" . }}-web
                port:
                  number: 80
---
# catalog 的 gRPC 入口:与 web 同一个 host(同一个域名),按路径分流 —— gRPC 的
# 方法路径天然带服务全名前缀(/rerun.cloud.v1alpha1.RerunCloudService/…),与
# viewer/质检台互不冲突。单独一条 Ingress,因为 backend-protocol 注解作用于
# 整条 Ingress,而同 host 的纯 HTTP 路径(上面)不能按 gRPC 转发。
# 实测(2026-08-20):unary/注册/流式 relay 全部经网关通过;路由变更有约
# 20-40s 生效延迟。
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "dataverse.fullname" . }}-catalog-grpc
  labels:
    {{- include "dataverse.labels" . | nindent 4 }}
  annotations:
    # 让网关对上游按 gRPC(HTTP/2)转发。APIG 主要按 Service 端口判定协议:下面 backend 指向
    # headless 的 `grpc` 端口(name=grpc / appProtocol=grpc,见 services-rerun.yaml),APIG 会
    # 自动用 HTTP/2。这条 backend-protocol 注解作为兜底一并保留(单靠它在 APIG 适配层不稳,
    # 会退化成 HTTP/1.1 → 后端 gRPC 收到非 h2 请求回 HTTP 400 "grpc-status missing")。
    nginx.ingress.kubernetes.io/backend-protocol: "GRPC"
    # 大批量注册等长调用不止 60s(网关缺省),放宽到 10 分钟。
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
spec:
  ingressClassName: {{ include "dataverse.ingressClassName" . }}
  rules:
    - host: {{ include "dataverse.webHost" . }}
      http:
        paths:
          - path: /rerun.cloud.v1alpha1.RerunCloudService
            pathType: Prefix
            backend:
              service:
                name: {{ include "dataverse.fullname" . }}-headless
                # Reference by NUMBER, not name: the APIG controller's CreateUpstream API
                # requires a numeric K8SService.Port (a named port fails with
                # MissingParameter.UpstreamSpec.K8SService.Port). 51235 is the `grpc`
                # Service port (appProtocol=grpc → APIG builds an HTTP/2 upstream).
                port:
                  number: 51235
{{- end }}
