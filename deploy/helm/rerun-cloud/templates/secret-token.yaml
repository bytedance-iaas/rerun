{{- if and .Values.catalog.tokenAuth.enabled (not .Values.secrets.existingTokenSecret) }}
# catalog token 的签名密钥,独立成一个 Secret:它只被 catalog 容器以 0400 文件
# 挂载,web / native 会话都看不到。推荐用 kubectl 管道直建(密钥不落盘、不进
# helm values)并配 secrets.existingTokenSecret 引用;本模板是 values 直填的
# 开发用后备。
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rerun-cloud.fullname" . }}-token-secret
  labels:
    {{- include "rerun-cloud.labels" . | nindent 4 }}
type: Opaque
stringData:
  server_token_secret: {{ required "catalog.tokenAuth.enabled=true 时需要签名密钥:推荐 kubectl 直建 Secret 并配 secrets.existingTokenSecret;或直填 secrets.serverTokenSecret;确要关闭认证请显式设 catalog.tokenAuth.enabled=false" .Values.secrets.serverTokenSecret | quote }}
{{- end }}
