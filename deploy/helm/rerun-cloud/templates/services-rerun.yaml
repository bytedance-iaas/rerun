# StatefulSet 的 governing service(headless):给 pod 稳定的集群内域名。
# 集群内客户端:rerun+http://{{ include "rerun-cloud.fullname" . }}-headless.{{ .Release.Namespace }}.svc.cluster.local:51234
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rerun-cloud.fullname" . }}-headless
  labels:
    {{- include "rerun-cloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: rerun
spec:
  clusterIP: None
  selector:
    {{- include "rerun-cloud.selectorLabels" (dict "root" . "component" "rerun") | nindent 4 }}
  ports:
    - name: web
      port: 80
    # catalog server 在 51234 上一菜两吃:HTTP/1.1(/api /catalog /version)+ gRPC(HTTP/2)。
    # APIG 按 Service 端口判定协议,所以拆成两个指向同一容器端口的 Service 端口:
    #   catalog(51234)= HTTP/1.1 路由用;grpc(51235→51234)= gRPC 路由用。
    # APIG Ingress 见到端口 name=grpc / appProtocol=grpc 就自动按 HTTP/2 转发(见 apig.yaml)。
    - name: catalog
      port: 51234
    - name: grpc
      port: 51235
      targetPort: 51234
      appProtocol: grpc
---
# web viewer 的集群内 service:APIG Ingress 的后端。
# 公网 HTTP 流量全部走网关(HTTPS + Basic auth),web 不直接挂公网 CLB。
# 集群内(训练任务等)直接访问:http://{{ include "rerun-cloud.fullname" . }}-web.{{ .Release.Namespace }}.svc.cluster.local
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rerun-cloud.fullname" . }}-web
  labels:
    {{- include "rerun-cloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: rerun
spec:
  type: ClusterIP
  selector:
    {{- include "rerun-cloud.selectorLabels" (dict "root" . "component" "rerun") | nindent 4 }}
  ports:
    - name: web
      port: 80
      targetPort: 80
