{{- if not .Values.secrets.existingSecret }}
# 所有 pod 共用的凭证。stringData 明文写入,k8s 转 base64(base64 只是编码不是加密)。
# 语义:某个 key 不存在 = 对应功能关闭(entrypoint 按文件是否存在判断),
# 所以可选项留空时这里直接不渲染该 key。
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rerun-cloud.fullname" . }}-secrets
  labels:
    {{- include "rerun-cloud.labels" . | nindent 4 }}
type: Opaque
stringData:
  tos_access_key: {{ required "secrets.tosAccessKey 必填(或改用 secrets.existingSecret)" .Values.secrets.tosAccessKey | quote }}
  tos_secret_key: {{ required "secrets.tosSecretKey 必填(或改用 secrets.existingSecret)" .Values.secrets.tosSecretKey | quote }}
  {{- with .Values.secrets.hfToken }}
  hf_token: {{ . | quote }}
  {{- end }}
  {{- if .Values.web.basicAuth.enabled }}
  # web viewer(nginx)与 Daft 质检台共用这份账号表,登录一次两边通行。
  web_htpasswd: {{ required "web.basicAuth.enabled=true 时 secrets.webHtpasswd 必填(每行「用户名:密码哈希」);确要关闭认证请显式设 web.basicAuth.enabled=false" .Values.secrets.webHtpasswd | quote }}
  {{- end }}
{{- end }}
