{{- if .Values.daft.enabled }}
# ══════════════════ Daft 质检台(robot-curation UI) ══════════════════
# 2026-08-19 云产品化改造:**不再静态挂载任何 TOS 桶**。数据面 = TOS 直连:
# 用户在界面上给「数据集 tos:// 路径 + 地区」和「输出 tos:// 路径 + 地区 +
# 交付名」,跑批进程用部署注入的 AK/SK(下方 TOS_* env)经 SDK 直读直写,
# 桶与前缀全部是运行时输入 —— 部署时不需要也不应该配置任何目标桶
# (daft.bucket / daft.srcBucket / daft.dataRoot / daft.deliveryPath 均已退役)。
# 镜像要求:含 TOS 直连支持的 robot_curator 镜像(Daft 仓库
# qian/daft-integrate-TOS 分支,curation/tos_store.py 在即可)。
#
# 与 rerun 分开的 StatefulSet(不进同一个 pod):质检管线是 CPU 密集的批处理,
# 和交互式 viewer 分开互不拖累,升级 viewer 也不会杀正在跑的质检任务。
# /data 是 emptyDir 工作区(数据集下载缓存 + 跑批产出暂存 + 任务状态):
# 真正的交付以「完整性标志最后传」的协议上传到用户指定的桶,pod 重启丢掉的
# 只是缓存与任务历史,不丢交付。
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "rerun-cloud.fullname" . }}-curation
  labels:
    {{- include "rerun-cloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: curation
spec:
  serviceName: {{ include "rerun-cloud.fullname" . }}-curation
  replicas: 1
  selector:
    matchLabels:
      {{- include "rerun-cloud.selectorLabels" (dict "root" . "component" "curation") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rerun-cloud.selectorLabels" (dict "root" . "component" "curation") | nindent 8 }}
      annotations:
        checksum/secrets: {{ include (print $.Template.BasePath "/secret-viewer.yaml") . | sha256sum }}
        checksum/site-config: {{ include (print $.Template.BasePath "/configmap-curation.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: curation
          # 镜像 entrypoint 就是 `curation`。
          image: {{ required "daft.enabled=true 时 image.curator 必填(robot_curator 镜像地址)" .Values.image.curator | quote }}
          # --delivery/--data-root 指本地工作区:交付根空着也能启动(镜像内
          # 自动放占位交付);「任务台」的跑批输入输出都是 tos:// URL,
          # 这两个本地目录只承载任务状态与占位。
          args:
            - ui
            - --delivery
            - /data/deliveries
            - --data-root
            - /data/datasets
            - --root-path
            - {{ .Values.daft.rootPath | quote }}
          ports:
            - containerPort: 7860
          env:
            {{- if .Values.web.basicAuth.enabled }}
            # 与 web viewer 共用同一份 htpasswd 账号表(同域名部署,任意账号
            # 登录一次两边通行);验证也同为哈希比对,不再需要明文账号。
            - name: CURATION_UI_HTPASSWD_FILE
              value: /etc/curation-auth/htpasswd
            {{- end }}
            - name: CURATION_CONFIG
              value: /etc/curation/site.yaml
            {{- if .Values.daft.terminal }}
            # 「终端」页签(内嵌 xterm,真 shell,与 UI 同一份 Basic auth 保护)。
            # 镜像不默认开,由这里显式注入;不想要 shell 就在 values 关掉。
            - name: CURATION_TERMINAL
              value: "1"
            {{- end }}
            # TOS 直连凭证:桶来自用户输入,凭证来自部署(与 viewer 的
            # tos-config.json 同一对 AK/SK,同一份 secret)。环境变量名与
            # Daft 引擎 TosConfig.from_env 一致。端点给内网形式(pod 在 VPC
            # 内,快且不计公网流量);代码只取其中的「地区 + 内外网」两个事实,
            # 用户选异地区时自动换成对应公网端点。
            - name: TOS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "rerun-cloud.viewerSecretName" . }}
                  key: tos_access_key
            - name: TOS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "rerun-cloud.viewerSecretName" . }}
                  key: tos_secret_key
            - name: TOS_ENDPOINT
              value: {{ .Values.tos.endpointInternal | quote }}
            # 数据集下载缓存固定到 /data(emptyDir),与任务状态同一块盘。
            - name: CURATION_TOS_CACHE
              value: /data/tos-cache
            {{- if hasKey ((.Values.daft.resources).limits | default dict) "ephemeral-storage" }}
            # 容器存储限额(downward API):体积预检用它算"还能安全写多少",
            # 防止大数据集把 pod 写到被 kubelet 驱逐。
            - name: CURATION_EPHEMERAL_LIMIT_BYTES
              valueFrom:
                resourceFieldRef:
                  containerName: curation
                  resource: limits.ephemeral-storage
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz # 直连容器端口,不带前缀(带前缀的 /curation/healthz 也通)
              port: 7860
            initialDelaySeconds: 5
            periodSeconds: 10
          # 质检管线吃 CPU(光流/视频解码/质检全在 CPU 上)。给 limits 配上
          # ephemeral-storage 才能启用体积预检(见上方 downward API 注入)。
          resources:
            {{- toYaml .Values.daft.resources | nindent 12 }}
          volumeMounts:
            - name: scratch
              mountPath: /data
            {{- if .Values.web.basicAuth.enabled }}
            - name: curation-auth
              mountPath: /etc/curation-auth
              readOnly: true
            {{- end }}
            - name: site-config
              mountPath: /etc/curation
      volumes:
        # 本地工作区:数据集缓存 / 跑批暂存 / 任务状态。emptyDir 用量计入
        # 容器 ephemeral-storage 限额(daft.resources.limits 配了就生效)。
        - name: scratch
          emptyDir: {}
        {{- if .Values.web.basicAuth.enabled }}
        - name: curation-auth
          secret:
            secretName: {{ include "rerun-cloud.viewerSecretName" . }}
            items:
              - key: web_htpasswd
                path: htpasswd
        {{- end }}
        - name: site-config
          configMap:
            name: {{ include "rerun-cloud.fullname" . }}-curation-site
---
# /curation 的后端;同时是 daft StatefulSet 的 governing service
# (headless 即可,APIG Ingress 按 endpoints 转发)。
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rerun-cloud.fullname" . }}-curation
  labels:
    {{- include "rerun-cloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: curation
spec:
  clusterIP: None
  selector:
    {{- include "rerun-cloud.selectorLabels" (dict "root" . "component" "curation") | nindent 4 }}
  ports:
    - name: ui
      port: 7860
      targetPort: 7860
{{- end }}
