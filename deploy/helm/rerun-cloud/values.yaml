# rerun-cloud chart 的默认配置。
# 必填项(不填 helm 会报错并指明缺什么):
#   image.rerun、network.subnetId,daft.enabled 时的 image.curator,
#   以及密钥 —— 推荐 kubectl 直建 Secret 后配三个 existing*Secret 引用(values 零密钥,
#   见部署文档);开发环境也可直填 secrets.* 字段由 chart 渲染。
# 真实值不要写进本文件:另建一个 gitignore 挡住的 values 文件(例:values-prod.yaml),
#   helm install rerun-cloud deploy/helm/rerun-cloud -n rerun --create-namespace -f values-prod.yaml

image:
  # rerun 镜像(web viewer 和 catalog server 同一个镜像,例:
  # iaas-us-cn-beijing.cr.volces.com/physicalai/rerun:<tag>)。
  rerun: ""
  # robot_curator 镜像。两条底线:≥ Daft 仓库 commit 412b91ce8(子路径支持,
  # 旧镜像挂在 /curation 下静态资源/WS 全 404);且须含 htpasswd 鉴权支持
  # (CURATION_UI_HTPASSWD_FILE,2026-08-17 之后的构建),旧镜像收不到账号配置
  # 会以无鉴权状态运行。
  curator: ""

network:
  # APIG 网关所在子网 ID。必须是【当前集群】VPC 里的子网,跨集群抄会
  # 报 cannot be found from VPC 且永远 Pending。查法:抄本集群任一正常
  # LoadBalancer Service 的 volcengine-loadbalancer-subnet-id 注解。
  subnetId: ""

tos:
  region: cn-beijing
  # 公网 endpoint:下发给浏览器和云外客户端用。
  endpointPublic: https://tos-s3-cn-beijing.volces.com
  # 内网 endpoint:云内组件访问 TOS 用,快且不计公网流量。
  # 集群没开内网访问 TOS 时,把它也改成公网 endpoint。
  endpointInternal: https://tos-s3-cn-beijing.ivolces.com
  # fsx CSI(TOS 模式)用的挂载 server 地址。
  # ⚠️ 2026-08-19 起质检台不再挂载 TOS(改 SDK 直连),本值当前无消费者;
  # 保留是为将来别的组件要挂载时不用再查一遍。
  fsxServer: tos-cn-beijing.ivolces.com
  # 转换后 rrd 产物的缓存桶;"off" 关闭缓存。
  rrdArtifactsUrl: "off"

secrets:
  # 非空 = 密钥由集群里已存在的同名 Secret 提供(需含下方各 key 名),
  # chart 不再渲染 viewer-secrets,本节其余字段忽略,认证开关只看
  # web.basicAuth.enabled / catalog.tokenAuth.enabled。
  # 质检台的 TOS 直连凭证(TOS_ACCESS_KEY/TOS_SECRET_KEY 环境变量)也从
  # 这份 Secret 取 tos_access_key / tos_secret_key 两个 key。
  existingSecret: ""
  tosAccessKey: ""
  tosSecretKey: ""
  # HuggingFace token,访问私有 HF 数据集才需要;留空则不写入。
  hfToken: ""
  # 火山方舟(Ark)API key,质检台的 VLM 类质检走方舟 MaaS 时用(注入成质检台的
  # ARK_API_KEY 环境变量)。留空则不写入,质检台不启用方舟后端。base url 不是密钥,
  # 见 daft.arkBaseUrl。用 existingSecret 时改为在那份 Secret 里加 key: ark_api_key。
  arkApiKey: ""
  # Basic auth 密码表(Apache htpasswd 格式):每行「用户名:密码哈希」,哈希用
  # openssl passwd -apr1 或 htpasswd -B 生成。多用户用 YAML 块写法一行一个。
  # web viewer 和 Daft 质检台共用这一份:同域名部署,任意账号登录一次两边通行。
  # web.basicAuth.enabled=false 时忽略(两边都不设防)。
  webHtpasswd: ""
  # catalog token 签名密钥所在的已有 Secret 名(须含 key: server_token_secret)。
  # 推荐:kubectl 管道直建,密钥不落盘、不进 values —— 见部署文档。
  # 密钥只会以 0400 文件挂进 catalog 容器,web / native 会话都看不到。
  existingTokenSecret: ""
  # 开发用后备:签名密钥直填 values(rerun server generate-secret 生成,只生成
  # 一次;拿到它的人能签任意权限 token)。生产环境用上面的 existingTokenSecret。
  # catalog.tokenAuth.enabled=false 时两者都忽略。
  serverTokenSecret: ""

web:
  # 关闭 = 页面无认证,仅限内网/本地调试;公网必须开。
  basicAuth:
    enabled: true
  # 打开数据集时并发下载几个现成 rrd 产物;0 = 自动(浏览器 3)。
  rrdArtifactsPrefetch: "0"
  # Diagnose 按钮目标地址覆盖。空 = 同域 /curation(本 chart 的标准拓扑,一般不用动)。
  daftUrl: ""
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi

catalog:
  # 关闭 = 无认证裸奔,仅限内网调试。
  tokenAuth:
    enabled: true
  # 桶 CORS 自助配置:web viewer 打开一个桶时,经同域 /api/ensure-cors 请 server
  # 检查并补配该桶的 CORS(只追加我们的规则,不动别家的)。需要 AK/SK 有桶管理
  # 权限;关掉则回到部署文档里的手动配置流程。
  autoCors:
    enabled: true
    # 放行的浏览器 origin 列表;空 = 自动(该区域的网关通配域名 + 本地调试 origin)。
    origins: []
  # dataloader 直读的预签名 URL 用哪个 endpoint 签(只影响发给客户端的 URL)。
  # 缺省公网:云外训练客户端才连得上。客户端在同一 VPC 内跑时改成内网 endpoint。
  presignEndpoint: https://tos-s3-cn-beijing.volces.com
  # HF 相关操作的镜像站;空 = 直连官方(海外集群用)。
  hfEndpoint: https://hf-mirror.com
  # catalog 数据库 + 远端文件缓存盘(volumeClaimTemplates,uninstall 不会删)。
  storage:
    className: ebs-essd
    size: 100Gi
  resources:
    requests:
      cpu: "1"
      memory: 2Gi
    limits:
      cpu: "4"
      memory: 8Gi

daft:
  # false = 不部署质检台,连带跳过站点配置和 Ingress 的 /curation 路径。
  enabled: true
  # ★ 2026-08-19 云产品化:质检台不再静态挂载 TOS 桶,目标桶也不在部署时
  #   配置 —— 数据集来源与交付去向都是用户在界面上运行时给的 tos:// 路径 +
  #   地区,凭证用部署注入的 AK/SK(secrets.tosAccessKey/tosSecretKey)。
  #   旧的 bucket / srcBucket / tosBuckets / dataRoot / deliveryPath / fsx.*
  #   已全部退役,不再被任何模板消费;老 values 文件里残留这些键无害但无效。
  rootPath: /curation
  # 「终端」页签(内嵌网页终端,**真 shell**,与 UI 共用 Basic auth)。排障用;
  # 对 shell 暴露有顾虑就设 false,页签不渲染、/ws/term 路由也不注册。
  terminal: true
  # VLM 后端预设,原样渲染进质检台的 site.yaml(键名/字段与其格式一致)。
  # 空 = 只有出厂占位预设,VLM 类质检不可用(除非下方 vllm.enabled=true 自动注入一个)。
  # 质检台的可用后端只认 site.yaml 里的 vlm_backends —— 没有 k8s 自动发现,所以要让
  # 界面能选到某个 vLLM,它就必须出现在这里(本 chart 部署的那个由 vllm.enabled 自动注入)。
  # 这里配的是【外部】已有的 vLLM/MaaS 后端(自动注入的 self-hosted 键会与它们合并,
  # 同名时以这里为准)。每个后端至少要有 endpoint;endpoint 含 "YOUR-" 或为空的会被界面过滤掉。示例:
  # vlmBackends:
  #   h20-8b:
  #     endpoint: http://vllm-cosmos-8b.curation.svc.cluster.local:8000/v1
  #     model: nvidia/Cosmos-Reason2-8B
  #     api_key_env:
  #     hardware: NVIDIA H20
  #     service_type: 自托管 vLLM
  vlmBackends: {}
  # 火山方舟(Ark)VLM 服务的 base url,注入成质检台的 ARK_BASE_URL 环境变量。
  # 这是普通配置不是密钥;配套的 API key 走 secrets.arkApiKey(密钥)。
  # 留空则不注入 ARK_BASE_URL(质检台不启用方舟后端时可不管)。
  arkBaseUrl: https://ark.cn-beijing.volces.com/api/v3
  resources:
    requests:
      cpu: "2"
      memory: 4Gi
    limits:
      cpu: "8"
      memory: 16Gi

vllm:
  # false = 不部署自托管 LLM(默认)。打开需要一张 GPU 卡:质检台的 VLM 类质检
  # (task_success)通过 OpenAI 兼容 API 连它。enabled=true 时 chart 会自动把它注册进
  # 质检台的 vlm_backends(键名 self-hosted,见 configmap-curation.yaml),界面直接能选,
  # 不用手抄集群内 DNS。它与 rerun / curation 同 namespace,是一个独立 Deployment。
  enabled: false
  # vLLM 服务镜像(OpenAI 兼容)。daocloud 代理拉官方镜像。
  image: docker.m.daocloud.io/vllm/vllm-openai:latest
  # 模型:容器内本地路径(权重由下方 weightFetch 下到 emptyDir,路径为 /models/<modelName>),
  # 或直接填 HF repo id 让 vllm 自己拉(那样把 weightFetch.image 留空即可,配合 hfToken/hfEndpoint)。
  model: /models/Cosmos-Reason2-32B
  # OpenAI 兼容 API 对外宣称的 model 名。质检台按这个名字发请求,必须与之匹配 ——
  # 自动注册进 vlm_backends 的 model 字段就取它。空 = 用 model 本身(本地路径当名字不好看,
  # 建议显式给一个规范名,如 nvidia/Cosmos-Reason2-32B)。
  servedModelName: nvidia/Cosmos-Reason2-32B
  # 传给 vllm 的额外参数(--model/--served-model-name/--port 由 chart 拼好,别在这里重复)。
  # 32B 单卡示例:权重 fp16 ~64GB,H20 96GB → 显存利用率提到 0.92、上下文收到 32768
  # (KV 余量 ~20GB);实测 OOM 或上下文不够就上 2 卡并加 --tensor-parallel-size 2。
  extraArgs:
    - --gpu-memory-utilization
    - "0.92"
    - --max-model-len
    - "32768"
    - --trust-remote-code
  port: 8000
  # GPU 数量(= resources.limits."nvidia.com/gpu",无需在 resources 里重复写)。
  gpuCount: 1
  # 钉到指定节点:抄目标 GPU 节点的 kubernetes.io/hostname(参考里是某张空卡的 IP)。
  # 空 = 不钉,调度器挑任意满足 GPU 请求的节点。
  nodeHostname: ""
  # 额外 nodeSelector / tolerations(挑特定卡型、容忍 GPU 污点时用)。
  nodeSelector: {}
  tolerations: []
  # /dev/shm 大小(张量并行 / 大 batch 需要;单卡也建议给足)。
  dshmSize: 16Gi
  # 权重预取 initContainer:在 GPU 节点本地盘(emptyDir)下模型,不进镜像、不落 TOS。
  # 默认走内网 oniond + 火山镜像源流程(与现有同事的部署一致)。
  # image 留空 = 不跑 init 容器(改由 vllm 从 HF 直拉,或权重已在镜像里)。
  weightFetch:
    # 有装 oniond 能力的镜像(参考用的是 robot_curator 镜像)。空 = 不跑 init。
    image: iaas-us-cn-beijing.cr.volces.com/physicalai/robot_curator:83d61eefc84dc7e8ebf674a770a6cf1b1793b2a0
    # oniond 下载用的 bucket。
    bucket: ai-infra
    # oniond 下载的模型名(oniond download model <modelName> --dir /models),
    # 权重落在 /models/<modelName>,应与上面的 model 本地路径对应。
    modelName: Cosmos-Reason2-32B
  # 额外资源(GPU 由 gpuCount 单独计;这里配 cpu/memory 等)。权重下到 emptyDir,
  # 大模型很吃 ephemeral-storage,需要时在 limits 里配上,防止被 kubelet 驱逐。
  resources:
    requests:
      cpu: "2"
      memory: 8Gi

apig:
  # false = 不建网关也不建 Ingress(自备入口时用)。
  enabled: true
  # 非空 = 适配已有 APIG 实例(平台实例 id);空 = 新建网关 + 前置 CLB。
  existingInstanceId: ""
  # 本实例专属的 ingressClass。空 = 从 release 名派生(<fullname>-apig)。
  # 集群里已有别的 APIG 实例时,千万别与其声明同一个 class,两个实例会互相抢 Ingress。
  ingressClassName: ""
  # Ingress 的 host,只是网关内部的分流键,不需要真实 DNS;平台按它分配
  # *.volceapi.com 公网域名。空 = 从 release 名派生(<fullname>-web.apig.internal)。
  # 改 host 要删掉 Ingress 重建(in-place apply 会残留旧 ADDRESS),部署后别轻易动。
  webHost: ""
