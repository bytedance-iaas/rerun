{{/*
A native viewer session: one pod, one ClusterIP Service, and an optional Ingress on the gateway
dataverse already provides. Nothing here is shared with other sessions, which is what lets a session
be opened and thrown away with `helm install` / `helm uninstall`.

How many sessions can run at once is decided by the namespace's resource quota — nothing in the
software caps it.
*/}}
{{- include "rerun-native-session.password.validate" . }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "rerun-native-session.name" . }}
  labels:
    {{- include "rerun-native-session.labels" . | nindent 4 }}
    app: rerun-native-session
    session: {{ include "rerun-native-session.name" . }}
spec:
  # A session is a session: when the viewer exits, the pod is done. Nothing restarts it, and the
  # stopped pod stays around so its logs can still be read — `helm uninstall` is what removes it.
  restartPolicy: Never
  # Secrets are mounted at /run/secrets; SA-token automounting is off so it cannot collide with the
  # read-only secret volume.
  automountServiceAccountToken: false
  containers:
    - name: viewer
      image: {{ include "rerun-native-session.image" . | quote }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      env:
        - name: MODE
          value: native
        - name: TOS_ENDPOINT
          value: {{ include "rerun-native-session.tos.endpoint" . | quote }}
        - name: TOS_REGION
          value: {{ .Values.tos.region | quote }}
        - name: TOS_RRD_ARTIFACTS_URL
          value: {{ .Values.tos.rrdArtifactsUrl | quote }}
        {{- with .Values.tos.rrdArtifactsRegion }}
        - name: TOS_RRD_ARTIFACTS_REGION
          value: {{ . | quote }}
        {{- end }}
        {{- with .Values.catalog.hfEndpoint }}
        - name: HF_ENDPOINT
          value: {{ . | quote }}
        {{- end }}
        {{- with .Values.webViewerUrl }}
        - name: WEB_VIEWER_URL
          value: {{ . | quote }}
        {{- end }}
        - name: RRD_ARTIFACTS_PREFETCH
          value: {{ .Values.rrdArtifactsPrefetch | quote }}
        - name: SESSION_GEOMETRY
          value: {{ .Values.geometry | quote }}
      ports:
        - containerPort: 8080
      readinessProbe:
        httpGet:
          path: /vnc.html
          port: 8080
        initialDelaySeconds: 3
        periodSeconds: 5
      resources:
        {{- toYaml .Values.resources | nindent 8 }}
      volumeMounts:
        - name: tos-secrets
          mountPath: /run/secrets
          readOnly: true
        # Software rendering needs a decent amount of shared memory (the equivalent of docker's
        # shm_size: 1gb).
        - name: dshm
          mountPath: /dev/shm
  volumes:
    # dataverse's credentials plus this session's password, projected into the one /run/secrets
    # directory the entrypoint reads. Nothing sensitive reaches the environment.
    - name: tos-secrets
      projected:
        sources:
          - secret:
              name: {{ required "secrets.existingSecret is required: the name of dataverse's application-credentials Secret in this namespace." .Values.secrets.existingSecret }}
          - secret:
              name: {{ .Values.existingPasswordSecret }}
              items:
                - key: session_password
                  path: session_password
                  mode: 256 # 0400
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 1Gi
---
# The session's in-cluster service, and the backend behind its Ingress. The `session` label is
# unique per release, so this selects one session and never someone else's.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rerun-native-session.name" . }}
  labels:
    {{- include "rerun-native-session.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    session: {{ include "rerun-native-session.name" . }}
  ports:
    - name: novnc
      port: 8080
      targetPort: 8080
{{- if .Values.ingress.enabled }}
---
# This session's public entry point, on the gateway dataverse provides: its own host, so the
# platform assigns it a *.volceapi.com domain of its own. noVNC's WebSocket runs over HTTP/1.1,
# which the gateway forwards without any extra annotation.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "rerun-native-session.name" . }}
  labels:
    {{- include "rerun-native-session.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ required "ingress.className is required: the ingress class dataverse's APIG gateway declares. Set ingress.enabled=false to keep the session off the public internet." .Values.ingress.className }}
  rules:
    - host: {{ include "rerun-native-session.host" . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "rerun-native-session.name" . }}
                port:
                  number: 8080
{{- end }}
